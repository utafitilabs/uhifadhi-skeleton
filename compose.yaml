
services:
###> doctrine/doctrine-bundle ###
  database:
    # PostgreSQL + PostGIS, published for linux/amd64 and linux/arm64 alike
    # (Apple Silicon included), built from the official postgres image and the
    # PGDG PostGIS packages — https://github.com/utafitilabs/postgis
    image: ghcr.io/utafitilabs/postgis:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    # Mercure 1.0, the hub FrankenPHP bundles from v1.13.0, so development
    # speaks the protocol a FrankenPHP-served installation does: subscriptions
    # on `match=`, tokens bound to a trusted issuer, and the cookie the app and
    # the hub agree on below.
    image: dunglas/mercure:v1.0
    restart: unless-stopped
    environment:
      # HTTPS off: the hub answers plain http on port 80, the port the Symfony
      # CLI maps to MERCURE_URL. With HTTPS on (the image's default) port 80
      # only redirects to 443, which is not published, and the address the CLI
      # hands the app answers 308.
      # https://mercure.rocks/docs/hub/install ("disable via SERVER_NAME=:80")
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # The issuer the app's tokens name (`iss`, MERCURE_JWT_ISSUER in .env):
      # a 1.0 hub accepts a token only from an issuer it trusts.
      # https://mercure.rocks/docs/hub/config ("issuer")
      MERCURE_TRUSTED_ISSUERS: 'https://127.0.0.1:8000'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      # (the Symfony CLI's address, over http and over https once its local certificate authority is installed).
      # The cookie name is prefix-less because this hub is plain http, where a
      # browser never sends a __Secure- cookie ("Use a prefix-less name only for
      # local HTTP development"); MERCURE_COOKIE_NAME in .env is the same name.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 https://127.0.0.1:8000
        cookie_name mercure_access_token
    # The image's own readiness check, on the Caddy admin API (IPv4 only): 200 once every
    # transport can serve. The /healthz on port 80 is deprecated in 1.0.
    # https://mercure.rocks/docs/production/health-monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/mercure/health/ready"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
